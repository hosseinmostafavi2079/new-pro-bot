services:
  db:
    image: postgres:15
    container_name: event_pro_db
    environment:
      - POSTGRES_DB=${DB_NAME:-eventdb}
      - POSTGRES_USER=${DB_USER:-eventuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-eventpass}
    ports:
      - "54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: event_pro_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata: